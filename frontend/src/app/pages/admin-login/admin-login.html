<div class="auth-page">
  <app-public-navbar></app-public-navbar>

  <main class="auth-main">
    <section class="login-shell">
      <div class="logo-plate">
        <h1 class="auth-brand">Freight Flow 360</h1>
      </div>

      <div class="auth-card">
        <div class="card-heading">
          <p class="eyebrow">Secure Admin Access</p>
          <h2>Admin Portal</h2>
        </div>

        <form class="login-form" (ngSubmit)="login()">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="admin@freightflow360.com"
          />

          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter password"
          />

          <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

          <button type="submit" class="signin-button" [disabled]="loading">
            {{ loading ? 'Signing in...' : 'Sign In' }}
          </button>

          <p class="create-account-text">
            Don’t have an account?
            <a href="#" (click)="$event.preventDefault()">Create Account</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  
</div>
